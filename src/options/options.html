<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>gpt-skin 설정</title>
  <link rel="stylesheet" href="../shared/ds.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="topbar">
    <span class="ds-dot" data-on="1"></span>
    <span class="brand">gpt-skin</span>
    <span class="title" id="title"></span>
    <span class="spacer"></span>
    <span class="ds-badge ds-badge--accent" id="saved" hidden></span>
  </header>

  <div class="wrap">
    <nav id="nav"></nav>
    <main id="fields"></main>
  </div>

  <footer class="statusline">
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <span class="ds-text-3" id="syncNote"></span>
    <button id="reset" class="ds-link ds-link--danger" type="button"></button>
  </footer>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>
