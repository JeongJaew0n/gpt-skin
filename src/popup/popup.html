<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>gpt-skin</title>
  <link rel="stylesheet" href="../shared/ds.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <span class="ds-dot" id="dot"></span>
    <span class="brand">gpt-skin</span>
    <span class="spacer"></span>
    <span class="build ds-mono" id="build"></span>
  </header>

  <section class="skins">
    <span class="skins-label" id="skins-label">스킨</span>
    <span class="skin-list ds-seg" id="skin-list" role="radiogroup"></span>
  </section>
  <p class="skin-note" id="skin-note" hidden></p>

  <main class="rows">
    <button class="row" id="row-terminal" type="button" disabled>
      <span class="labels">
        <span class="line">
          <span class="label" id="tab-label">이 탭에 스킨 켜기</span>
          <span class="ds-kbd">Ctrl+&#96;</span>
        </span>
        <span class="help" id="terminal-help">확인 중…</span>
      </span>
      <span class="ds-switch" id="sw-terminal" data-on="0"><span class="ds-switch__knob"></span></span>
    </button>

    <button class="row" id="row-default" type="button">
      <span class="labels">
        <span class="label" id="default-label">ChatGPT 를 열면 바로 스킨으로</span>
        <span class="help" id="default-help">꺼 두면 원본 UI 로 시작합니다.</span>
      </span>
      <span class="ds-switch" id="sw-default" data-on="0"><span class="ds-switch__knob"></span></span>
    </button>
  </main>

  <footer class="foot">
    <button class="ds-link" id="palette" type="button">명령 열기</button>
    <button class="ds-link" id="shortcuts" type="button">단축키</button>
    <button class="ds-link" id="diag" type="button">진단 복사</button>
    <span class="spacer"></span>
    <button class="ds-link" id="options" type="button">설정 전체</button>
  </footer>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
